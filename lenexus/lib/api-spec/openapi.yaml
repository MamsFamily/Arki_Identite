      "url": "/api"
    }
  ],
  "tags": [
    {
      "name": "tribes"
    }
  ],
  "paths": {
    "/shop": {
      "get": {"operationId":"getShop","responses":{"200":{"description":"Shop et dons réservés aux comptes Discord connectés","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ShopCatalog"}}}},"401":{"description":"Connexion Discord obligatoire"}}}
    },
    "/donations": {
      "get": {"operationId":"getDonations","responses":{"200":{"description":"Dons réservés aux comptes Discord connectés","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ShopDonations"}}}},"401":{"description":"Connexion Discord obligatoire"}}}
    },
    "/guides": {
      "get": {"operationId":"listGuides","responses":{"200":{"description":"Guides publics de la communauté","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommunityGuide"}}}}}}},
      "post": {"operationId":"createGuide","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideInput"}}}},"responses":{"201":{"description":"Guide publié directement","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CommunityGuide"}}}}}}
    },
    "/guides/{guideId}": {
      "parameters":[{"name":"guideId","in":"path","required":true,"schema":{"type":"string"}}],
      "get":{"operationId":"getGuide","responses":{"200":{"description":"Guide et transcription complète du fil Discord","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CommunityGuide"}}}}}},
      "put":{"operationId":"updateGuide","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideInput"}}}},"responses":{"200":{"description":"Guide modifié sans altérer les messages Discord importés","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CommunityGuide"}}}}}},
      "delete":{"operationId":"deleteGuide","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideRevision"}}}},"responses":{"200":{"description":"Guide retiré du site uniquement","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideStatus"}}}}}}
    },
    "/guide-uploads/request-url": {
      "post":{"operationId":"requestGuideImage","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideImageRequest"}}}},"responses":{"200":{"description":"Envoi direct d'une image dans le stockage durable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideImageUpload"}}}}}}
    },
    "/guide-uploads/publish": {
      "post":{"operationId":"publishGuideImage","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideImagePath"}}}},"responses":{"200":{"description":"Image vérifiée et disponible pour un guide","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GuideImagePublished"}}}}}}
    },
    "/dino-catalogue": {
      "get": {"operationId":"listDinoSpecies","parameters":[{"name":"all","in":"query","schema":{"type":"boolean"}}],"responses":{"200":{"description":"Catalogue lié aux maps et mods du site","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/DinoSpecies"}}}}}}},
      "post":{"operationId":"createDinoSpecies","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoSpeciesInput"}}}},"responses":{"201":{"description":"Espèce ou variante ajoutée par un administrateur ou propriétaire du site","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoSpecies"}}}}}}
    },
    "/dino-catalogue/{speciesId}": {
      "parameters":[{"name":"speciesId","in":"path","required":true,"schema":{"type":"integer"}}],
      "put":{"operationId":"updateDinoSpecies","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoSpeciesInput"}}}},"responses":{"200":{"description":"Créature modifiée","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoSpecies"}}}}}}
    },
    "/tribes/{id}/dino-records": {
      "parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer"}}],
      "get":{"operationId":"listDinoRecords","responses":{"200":{"description":"Records privés de la tribu","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/DinoRecord"}}}}}}}
    },
    "/tribes/{id}/dino-records/{speciesId}": {
      "parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer"}},{"name":"speciesId","in":"path","required":true,"schema":{"type":"integer"}}],
      "put":{"operationId":"saveDinoRecord","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoRecordInput"}}}},"responses":{"200":{"description":"Records confirmés","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoRecord"}}}}}},
      "delete":{"operationId":"deleteDinoRecord","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoRecordDelete"}}}},"responses":{"200":{"description":"Fiche supprimée après confirmation","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoDeleteStatus"}}}}}}
    },
    "/tribes/{id}/dino-photo": {
      "parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer"}}],
      "post":{"operationId":"readDinoPhoto","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoPhotoInput"}}}},"responses":{"200":{"description":"Lecture à vérifier, sans enregistrement automatique","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DinoPhotoResult"}}}}}}
    },
    "/tribes/{id}/dino-history": {
      "parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer"}}],
      "get":{"operationId":"listDinoHistory","responses":{"200":{"description":"Les 100 dernières modifications","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/DinoRecordHistory"}}}}}}}
    },
    "/site-maps": {
      "get": {
        "operationId": "listSiteMaps", "tags": ["tribes"], "summary": "Fiches publiques des maps",
        "responses": {"200": {"description": "Maps", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/SiteMap"}}}}}}
      }
    },
    "/site-maps/{slug}": {
      "parameters": [{"name": "slug", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[a-z0-9-]+$", "maxLength": 80}}],
      "get": {
        "operationId": "getSiteMap", "tags": ["tribes"], "summary": "Consulter une map",
        "responses": {"200": {"description": "Map", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SiteMap"}}}}, "404": {"description": "Map introuvable"}}
      },
      "put": {
        "operationId": "updateSiteMap", "tags": ["tribes"], "summary": "Modifier une map en tant que propriétaire du site",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SiteMapInput"}}}},
        "responses": {
          "200": {"description": "Map enregistrée", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SiteMap"}}}},
          "400": {"description": "Formulaire invalide"}, "401": {"description": "Connexion requise"}, "403": {"description": "Propriétaire requis"}, "404": {"description": "Map introuvable"}, "409": {"description": "Map modifiée par un autre propriétaire"}
        }
      }
    },
    "/site-maps/{slug}/settlements": {
      "parameters": [{"name":"slug","in":"path","required":true,"schema":{"type":"string","pattern":"^[a-z0-9-]+$","maxLength":80}}],
      "get": {"operationId":"getMapSettlements","tags":["tribes"],"summary":"Tribus dont la base principale est sur cette map",
        "responses":{"200":{"description":"Implantations déclarées et carte","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MapSettlements"}}}},"404":{"description":"Map introuvable"}}}
    },
    "/site-maps/{slug}/cartography": {
      "parameters": [{"name":"slug","in":"path","required":true,"schema":{"type":"string","pattern":"^[a-z0-9-]+$","maxLength":80}}],
      "put":{"operationId":"saveMapCartography","tags":["tribes"],"summary":"Enregistrer la carte officielle en tant que propriétaire",
        "requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MapCartographyInput"}}}},
        "responses":{"200":{"description":"Carte enregistrée","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MapCartography"}}}},"400":{"description":"Image invalide"},"401":{"description":"Connexion requise"},"403":{"description":"Propriétaire requis"},"409":{"description":"Carte modifiée entre-temps"}}}
    },
    "/my-tribes/name": {
      "put": {
        "operationId": "updateMyTribeName", "tags": ["tribes"],
        "summary": "Modifier son propre nom en jeu dans toutes ses tribus du serveur",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MemberNameInput"}}}},
        "responses": {
          "200": {"description": "Nom enregistré", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StatusResponse"}}}},
          "400": {"description": "Nom invalide"}, "401": {"description": "Connexion requise"}, "403": {"description": "CSRF invalide"}, "404": {"description": "Aucune tribu"}
        }
      }
    },
    "/tribes/{id}/leave": {
      "post": {
        "operationId": "leaveTribe", "tags": ["tribes"],
        "summary": "Quitter soi-même une tribu, sauf pour son propriétaire",
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}],
        "responses": {
          "200": {"description": "Tribu quittée", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StatusResponse"}}}},
          "400": {"description": "Le propriétaire doit transférer la propriété"}, "401": {"description": "Connexion requise"}, "403": {"description": "Action interdite"}, "404": {"description": "Membre introuvable"}
        }
      }
    },
    "/tribes/{id}/history": {
      "get": {
        "operationId": "getTribeHistory", "tags": ["tribes"],
        "summary": "Historique complet paginé, réservé aux gestionnaires",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}},
          {"name": "before", "in": "query", "schema": {"type": "integer", "minimum": 1}}
        ],
        "responses": {
          "200": {"description": "Page d’historique", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TribeHistoryPage"}}}},
          "400": {"description": "Pagination invalide"}, "401": {"description": "Connexion requise"}, "403": {"description": "Accès réservé"}
        }
      }
    },
    "/community-invite": {
      "get": {
        "operationId":"getCommunityInvite", "tags":["tribes"],
        "summary":"Lien d’invitation Discord après identification, y compris pour les non-membres",
        "responses":{
          "200":{"description":"Invitation","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CommunityInvite"}}}},
          "401":{"description":"Identification Discord requise"}
        }
      }
    },
    "/player-search": {
      "get": {
        "operationId": "searchPlayerProfiles", "tags": ["tribes"],
        "summary": "Recherche de joueurs réservée aux membres du serveur Discord",
        "parameters": [{"name":"q","in":"query","required":true,"schema":{"type":"string","minLength":2,"maxLength":80}}],
        "responses": {
          "200":{"description":"Informations publiques des joueurs du serveur","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PlayerSearchResults"}}}},
          "400":{"description":"Recherche invalide"}, "401":{"description":"Connexion requise"},
          "403":{"description":"Appartenance au serveur requise"}, "503":{"description":"Discord indisponible"}
        }
      }
    },
    "/site-mods": {
      "get": {
        "operationId": "listSiteMods", "tags": ["tribes"], "summary": "Catalogue public des mods du cluster", "security": [],
        "responses": {
          "200": {"description": "Catalogue public des mods", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/SiteMod"}}}}}
        }
      },
      "post": {
        "operationId": "createSiteMod", "tags": ["tribes"], "summary": "Ajouter un mod en tant que propriétaire",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SiteModInput"}}}},
        "responses": {"201": {"description": "Mod créé", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SiteMod"}}}}, "403": {"description": "Accès propriétaire requis"}}
      }
    },
    "/site-mods/{id}": {
      "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}],
      "put": {
        "operationId": "updateSiteMod", "tags": ["tribes"], "summary": "Modifier un mod en tant que propriétaire",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SiteModInput"}}}},
        "responses": {"200": {"description": "Mod modifié", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SiteMod"}}}}, "403": {"description": "Accès propriétaire requis"}, "404": {"description": "Mod introuvable"}}
      },
      "delete": {
        "operationId": "deleteSiteMod", "tags": ["tribes"], "summary": "Supprimer un mod en tant que propriétaire",
        "responses": {"200": {"description": "Mod supprimé", "content": {"application/json": {"schema": {"type": "object", "required": ["status"], "properties": {"status": {"type": "string"}}}}}}, "403": {"description": "Accès propriétaire requis"}, "404": {"description": "Mod introuvable"}}
      }
    },
    "/tribe-review": {
      "get": {
        "operationId": "getTribeReview",
        "tags": ["tribes"],
        "summary": "Alertes réservées au staff du site",
        "responses": {
          "200": {"description": "Contrôle des références et de la présence Discord", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TribeReview"}}}},
          "401": {"description": "Connexion requise"},
          "403": {"description": "Droits administrateur requis"}
        }
      }
    },
    "/discord-players": {
      "get": {
        "operationId": "listDiscordPlayers", "tags": ["tribes"],
        "parameters": [
          {"name":"q","in":"query","schema":{"type":"string","maxLength":80}},
          {"name":"after","in":"query","schema":{"type":"string","pattern":"^[0-9]{17,20}$"}},
          {"name":"tribeId","in":"query","schema":{"type":"integer","minimum":1}}
        ],
        "responses": {
          "200":{"description":"Server players","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DiscordPlayerPage"}}}},
          "400":{"description":"Invalid query"}, "401":{"description":"Login required"}, "403":{"description":"Forbidden"},
          "503":{"description":"Discord member directory unavailable"}
        }
      }
    },
    "/tribe-images/uploads": {
      "post": {
        "operationId": "requestTribeImageUpload", "tags": ["tribes"],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TribeImageUploadInput"}}}},
        "responses": {
          "200": {"description": "Upload ticket", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BrandingUpload"}}}},
